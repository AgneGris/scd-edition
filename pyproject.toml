[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scd-edition"
version = "0.1.0"
description = "GUI for editing and visualizing SCD decomposition results"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
    {name = "Agnese Grison", email = "agnese.grison16@imperial.ac.uk"},
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
keywords = ["EMG", "decomposition", "GUI", "spike editing", "motor units"]

dependencies = [
    "swarm-contrastive-decomposition>=0.2.3",
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "h5py>=3.8.0",
    "matplotlib>=3.5.0",
    "pyqtgraph>=0.13.0",
    "PySide6>=6.5.0",
    "scikit-learn>=1.0.0",
    "mat73>=0.59",
    "pyyaml>=6.0",
    "cmcrameri>=1.0",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
cpu = [
    "torch>=2.11.0",
]
cuda = [
    "torch>=2.11.0",
]
dev = [
    "pillow>=11.0",
    "ruff>=0.16.8",
]

[project.scripts]
scd-edition = "scd_app.gui.main_window:main"

[project.urls]
Homepage = "https://github.com/AgneGris/scd-edition"
Repository = "https://github.com/AgneGris/scd-edition"
Issues = "https://github.com/AgneGris/scd-edition/issues"

[tool.uv]
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cuda" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["scd_app*"]

[tool.setuptools.package-data]
scd_app = [
    "gui/style/fonts/*.ttf",
    "resources/loaders_configs/*.yaml",
    "resources/examples/*.json",
    "resources/examples/*.mat",
    "resources/examples/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: runs a real decomposition; deselect with -m 'not slow'",
]

[dependency-groups]
dev = [
    "pillow>=11.0",
    "ruff>=0.16.8",
    "pytest>=8.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["pytest_*", "src/scd_app/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PERF", "RUF"]
ignore = [
    "E501",
    "RUF001",
    "RUF002",
    "RUF003",
    "RUF012",
    # int(round(x)) guards against numpy 1.x returning a numpy scalar from
    # round(); the results index arrays, so the explicit cast stays.
    "RUF046",
    # Per-item try/except inside a loop is deliberate: one bad preset or
    # parameter field must not abort the whole batch.
    "PERF203",
]

[tool.ruff.lint.per-file-ignores]
# Console encoding must be reconfigured before the remaining imports run.
"scripts/*.py" = ["E402"]

# PySide6, matplotlib and pyqtgraph ship stubs narrower than their runtime
# behaviour, and Qt widget state is guarded by invariants the checker cannot
# trace across methods. These rules report almost only that, so they are off.
[tool.pyright]
include = ["src", "scripts"]
exclude = ["**/__pycache__", ".venv", "pytest_*", "src/scd_app/_vendor"]
pythonVersion = "3.10"
reportArgumentType = "none"
reportAttributeAccessIssue = "none"
reportCallIssue = "none"
reportOptionalMemberAccess = "none"
reportOptionalSubscript = "none"
reportPossiblyUnboundVariable = "none"
