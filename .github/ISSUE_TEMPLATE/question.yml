name: Usage or format question
description: Ask how to install, load or analyse data
title: "[Question]: "
labels: ["question"]
body:
  - type: input
    id: version
    attributes:
      label: SCD Edition version
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system and installation method
    validations:
      required: true
  - type: input
    id: format
    attributes:
      label: Acquisition system and file format
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Explain what you are trying to achieve and where you are stuck.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Data privacy
      options:
        - label: I have not attached participant recordings or identifying metadata.
          required: true
