name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Test the release source
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir . pytest ruff
          python -m ruff check src tests scripts docs
          python -m ruff format --check src tests scripts docs
          python -m pytest
      - name: Verify tag matches package version
        run: python -c "import os,tomllib; version=tomllib.load(open('pyproject.toml','rb'))['project']['version']; tag=os.environ['GITHUB_REF_NAME'].removeprefix('v'); assert version == tag, f'{tag=} does not match {version=}'"
      - name: Build distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
          python scripts/check_distribution.py
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/

  windows-app:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: python-dist
      - name: Install the release wheel and packager
        shell: pwsh
        run: |
          python -m pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          $wheel = (Get-ChildItem python-dist -Filter *.whl -File).FullName
          if (-not $wheel) { throw "Release wheel not found" }
          python -m pip install --no-cache-dir $wheel pyinstaller
      - name: Build and smoke-test the Windows application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/pyinstaller | Out-Null
          python -m PyInstaller --name SCD-Edition --onedir --windowed --clean --noconfirm --specpath build/pyinstaller --collect-data scd_app --collect-data scd --exclude-module IPython --exclude-module jedi --exclude-module jupyter --exclude-module notebook --exclude-module pandas --exclude-module pytest --exclude-module tkinter --exclude-module zmq src/scd_app/__main__.py
          $process = Start-Process -FilePath "dist/SCD-Edition/SCD-Edition.exe" -ArgumentList "--help" -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged application smoke test failed with exit code $($process.ExitCode)" }
          Copy-Item LICENSE, README.md, THIRD_PARTY_NOTICES.md -Destination dist/SCD-Edition
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          New-Item -ItemType Directory -Path release | Out-Null
          Compress-Archive -Path dist/SCD-Edition/* -DestinationPath "release/scd-edition-$version-windows-x86_64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-application
          path: release/*.zip

  github-release:
    needs: [build, windows-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: windows-application
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag

  pypi:
    needs: [build, windows-app]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/scd-edition/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
